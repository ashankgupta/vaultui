version: 2
project_name: vaultui
builds:
  - main: ./cmd/vaultui
    binary: vaultui
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
